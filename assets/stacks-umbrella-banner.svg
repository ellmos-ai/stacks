<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Panel Gradients GREEN -> BLUE -> PURPLE -->
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f0abfc" />
    </linearGradient>

    <!-- Canopy Top Highlight Arc -->
    <linearGradient id="canopyHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#a78bfa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Protection Glow Arc (Rainbow Shelter) -->
    <linearGradient id="shelterGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.20" />
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.00" />
    </linearGradient>

    <radialGradient id="shelterCenterAura" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.00" />
    </radialGradient>

    <!-- Metallic Shaft Gradient -->
    <linearGradient id="metalShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#090d16" flood-opacity="0.75" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ================= PROTECTION AREA / SCHUTZRAUM (BACKGROUND) ================= -->
  <!-- Translucent Rainbow Shelter Cone -->
  <path d="M 120 230 Q 600 30 1080 230 Q 950 490 600 490 Q 250 490 120 230 Z" fill="url(#shelterCenterAura)" />

  <!-- Protective Shield Arc Rays -->
  <path d="M 140 232 Q 600 65 1060 232" fill="none" stroke="url(#canopyHighlight)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />
  <path d="M 180 255 Q 600 110 1020 255" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />
  <path d="M 230 285 Q 600 160 970 285" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.25" />
  <path d="M 280 320 Q 600 210 920 320" fill="none" stroke="#34d399" stroke-width="1" opacity="0.2" />

  <!-- Rain / Data Drops OUTSIDE Umbrella (Left & Right) -->
  <g opacity="0.45">
    <!-- Left side rain -->
    <line x1="40" y1="30" x2="25" y2="90" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="80" y1="80" x2="65" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="30" y1="160" x2="15" y2="230" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <line x1="95" y1="210" x2="80" y2="280" stroke="#34d399" stroke-width="1" stroke-linecap="round" />
    <line x1="50" y1="290" x2="35" y2="360" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="110" y1="340" x2="95" y2="420" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right side rain -->
    <line x1="1160" y1="30" x2="1175" y2="90" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <line x1="1120" y1="80" x2="1135" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="1170" y1="160" x2="1185" y2="230" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="1105" y1="210" x2="1120" y2="280" stroke="#a855f7" stroke-width="1" stroke-linecap="round" />
    <line x1="1150" y1="290" x2="1165" y2="360" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="1090" y1="340" x2="1105" y2="420" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Splashes on Top Canopy -->
  <circle cx="160" cy="225" r="3" fill="#34d399" opacity="0.8" />
  <circle cx="280" cy="148" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="450" cy="92" r="3" fill="#60a5fa" opacity="0.9" />
  <circle cx="750" cy="92" r="3.5" fill="#a78bfa" opacity="0.9" />
  <circle cx="920" cy="148" r="4" fill="#f0abfc" opacity="0.8" />
  <circle cx="1040" cy="225" r="3" fill="#a855f7" opacity="0.8" />

  <!-- ================= UMBRELLA SHAFT & HANDLE ================= -->
  <!-- Main Shaft -->
  <rect x="596" y="70" width="8" height="395" rx="4" fill="url(#metalShaft)" />

  <!-- Curved Hook Handle at bottom -->
  <path d="M 600 460 C 600 495 555 495 555 470 C 555 455 570 455 570 465" fill="none" stroke="url(#metalShaft)" stroke-width="9" stroke-linecap="round" />

  <!-- Ferrule / Top Cap Spire -->
  <path d="M 593 72 L 600 40 L 607 72 Z" fill="#cbd5e1" />
  <circle cx="600" cy="38" r="5" fill="#38bdf8" filter="url(#neonGlow)" />

  <!-- ================= UMBRELLA CANOPY (5 PANELS) ================= -->
  <g filter="url(#dropShadow)">
    <!-- Panel 1: Leftmost (Green -> Teal) -->
    <path d="M 600 68 Q 360 110 120 230 Q 220 220 310 235 Q 430 130 600 68 Z" fill="url(#p1)" />

    <!-- Panel 2: Mid-Left (Teal -> Sky Blue) -->
    <path d="M 600 68 Q 430 130 310 235 Q 410 222 500 238 Q 540 120 600 68 Z" fill="url(#p2)" />

    <!-- Panel 3: Center (Sky Blue -> Indigo) -->
    <path d="M 600 68 Q 540 120 500 238 Q 600 225 700 238 Q 660 120 600 68 Z" fill="url(#p3)" />

    <!-- Panel 4: Mid-Right (Indigo -> Purple) -->
    <path d="M 600 68 Q 660 120 700 238 Q 790 222 890 235 Q 770 130 600 68 Z" fill="url(#p4)" />

    <!-- Panel 5: Rightmost (Purple -> Magenta) -->
    <path d="M 600 68 Q 770 130 890 235 Q 980 220 1080 230 Q 840 110 600 68 Z" fill="url(#p5)" />

    <!-- Scalloped Rib Trim Outline (Outer Edge) -->
    <path d="M 120 230 Q 220 220 310 235 Q 410 222 500 238 Q 600 225 700 238 Q 790 222 890 235 Q 980 220 1080 230 Q 600 45 120 230 Z" fill="none" stroke="url(#canopyHighlight)" stroke-width="3" />

    <!-- Rib Seam Lines -->
    <path d="M 600 68 Q 430 130 310 235" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
    <path d="M 600 68 Q 540 120 500 238" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
    <path d="M 600 68 Q 660 120 700 238" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
    <path d="M 600 68 Q 770 130 890 235" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />

    <!-- Rib Tip Jewels / Orbs -->
    <circle cx="120" cy="230" r="5" fill="#34d399" />
    <circle cx="310" cy="235" r="5" fill="#38bdf8" />
    <circle cx="500" cy="238" r="5" fill="#60a5fa" />
    <circle cx="700" cy="238" r="5" fill="#a78bfa" />
    <circle cx="890" cy="235" r="5" fill="#f0abfc" />
    <circle cx="1080" cy="230" r="5" fill="#c026d3" />
  </g>

  <!-- ================= TEXT ON CANOPY: "stacks" ================= -->
  <g filter="url(#textShadow)">
    <!-- Outer Glow / Stroke for max contrast on light & dark -->
    <text x="600" y="172" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" letter-spacing="6" fill="#ffffff" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" paint-order="stroke fill">stacks</text>
    
    <!-- Inner Crisp White Text -->
    <text x="600" y="172" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" letter-spacing="6" fill="#ffffff">stacks</text>

    <!-- Subtitle / Tagline below text on canopy -->
    <text x="600" y="202" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="7" fill="#e2e8f0" opacity="0.95">UMBRELLA CATALOG &amp; COMPOSITION FRAMEWORK</text>
  </g>
</svg>
